<div class="login-modal-overlay">
  <div class="login-modal">
    <button class="close-btn" (click)="closeLogin()">✖️</button>
    <div class="login-header">
      <h2>Welcome back 🚖</h2>
      <p>Sign in to your Vector account to continue</p>
    </div>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="Enter your email" />
        <div class="error-message" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          A valid email is required.
        </div>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" placeholder="Enter your password" />
        <div class="error-message" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          <span *ngIf="loginForm.get('password')?.errors?.['required']">Password is required.</span>
          <span *ngIf="loginForm.get('password')?.errors?.['minlength']">Password must be at least 6 characters.</span>
        </div>
      </div>
      <button class="login-btn" type="submit" [disabled]="loginForm.invalid">
        Log in
      </button>
    </form>
    
    <div class="signup-link">
      Don't have an account? <a (click)="registerAsRider()" style="cursor: pointer;">Sign up</a>
    </div>
  </div>
</div>
