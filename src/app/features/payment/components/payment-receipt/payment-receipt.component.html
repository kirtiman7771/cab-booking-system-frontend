<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

  <!-- <div class="container d-flex align-items-center justify-content-center min-vh-100 py-4 px-3"> -->

  <div class="card glass-card rounded-4 w-100" style="max-width: 650px;">
    <div class="card-body p-4 p-md-5 text-center">

      <div class="icon-circle bg-success-subtle text-success mx-auto mb-4">
        <i class="fa-solid fa-check"></i>
      </div>
      <h1 class="display-6 fw-bold mb-2">Payment Successful!</h1>
      <p class="text-muted fs-5 mb-5">Your transaction has been confirmed.</p>

      <div *ngIf=" userDataList !== null" class="text-start my-5 py-4 border-top border-bottom">

        <ul class="list-group list-group-flush bg-transparent">
          <li
            class="list-group-item d-flex justify-content-between align-items-start bg-transparent px-0 border-0 pb-3">
            <div class="me-3">
              <div class="text-muted">Pickup Location</div>
              <span class="fw-semibold fs-5">{{ userDataList.pickup }}</span>
            </div>
            <i class="fa-solid fa-location-dot text-primary fa-xl mt-1"></i>
          </li>

          <li
            class="list-group-item d-flex justify-content-between align-items-start bg-transparent px-0 border-0 pt-3">
            <div class="me-3">
              <div class="text-muted">Drop-off Location</div>
              <span class="fw-semibold fs-5">{{ userDataList.drop }}</span>
            </div>
            <i class="fa-solid fa-flag-checkered text-primary fa-xl mt-1"></i>
          </li>

          <li
            class="list-group-item d-flex justify-content-between align-items-center bg-transparent px-0 pt-4 mt-3 border-top">
            <div class="fw-bold fs-5">Total Fare</div>
            <span class="fw-bolder fs-4 text-success">₹{{ userDataList.fare }}</span>
          </li>
        </ul>
      </div>

      <!-- <div class="d-grid gap-3">
                            <button (click)="downloadReceipt()"
          class="btn btn-dark btn-lg rounded-pill fw-semibold py-3">
                      <i class="fa-solid fa-file-arrow-down me-2"></i>Download Receipt
                    </button>
                  <button class="btn btn-light bg-transparent rounded-pill py-3">
                      Book Another Ride
                    </button>
                </div> -->
    </div>
  </div>
  <!-- </div> -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
