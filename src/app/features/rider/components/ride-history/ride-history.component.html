<div class="container">
  <h2 class="text-center fw-bold py-4 mb-3 text-2xl text-gray-800">
    Rider History
  </h2>

  <div class="text-center">
    <button
      class="btn btn-outline-success me-3 shadow-sm hover:bg-green-500 hover:text-white transition-colors"
      [class.active]="filterType === 'reviewed'"
      (click)="showReviewed()"
    >
      <i class="bi bi-check-circle-fill me-1"></i> Reviewed
    </button>
    <button
      class="btn btn-outline-warning me-3 shadow-sm hover:bg-yellow-500 hover:text-gray-900 transition-colors"
      [class.active]="filterType === 'notReviewed'"
      (click)="showNotReviewed()"
    >
      <i class="bi bi-exclamation-circle-fill me-1"></i> Not Reviewed
    </button>
    <button
      class="btn btn-outline-secondary shadow-sm hover:bg-gray-500 hover:text-white transition-colors"
      [class.active]="filterType === 'all'"
      (click)="showAll()"
    >
      <i class="bi bi-list-ul me-1"></i> All Rides
    </button>
  </div>

  <div
    *ngIf="filteredList.length === 0"
    class="text-center p-8 bg-white rounded-xl shadow-md border border-gray-100 max-w-4xl mx-auto py-4"
  >
    <p class="text-xl text-gray-500">
      <i class="bi bi-info-circle me-2"></i> No rides found matching your filter.
    </p>
  </div>

  <div class="ride-history-container max-w-4xl mx-auto py-4">
    <div
      *ngFor="let r of paginatedList"
      class="ride-card mb-4 rounded-xl border border-gray-200 bg-white shadow-lg hover:shadow-2xl transition-all duration-300"
    >
      <div
        class="d-flex justify-content-between align-items-center ride-card-header"
      >
        <div class="text-sm text-gray-600 fw-medium">
          <i class="bi bi-calendar me-1"></i>
          {{ r.dateTime | date : "medium" }}
        </div>
        <div>

          
          <span

          class="badge-style font-semibold ride-status-badge"
            [ngClass]="{
              'bg-success': r.status === rideStatus.Completed,
              'bg-danger': r.status === rideStatus.CancelledByUser || r.status === rideStatus.CancelledByDriver,
              'bg-warning ': r.status === rideStatus.Ongoing,
              'bg-warning' : r.status === rideStatus.LookingForDriver,
              'bg-info text-dark': r.status === rideStatus.ConfirmedByDriver
            }"
          >
            {{ r.status }}
          </span>
        </div>
      </div>

      <div class="row g-2 align-items-center">
        <div class="col-md-7">
          <div class="mb-1">
            <span class="dot-icon pickup-dot"></span>
            <strong class="text-primary-emphasis me-2">Pickup:</strong>
            <span class="location-text text-gray-800">{{ r.pickupLocation }}</span>
          </div>
          <div class="mb-1">
            <span class="dot-icon drop-dot"></span>
            <strong class="text-danger-emphasis me-2">Drop:</strong>
            <span class="location-text text-gray-800">{{ r.dropLocation }}</span>
          </div>
          <div class="text-xs text-gray-500 mt-2">
            <i class="bi bi-car-front me-1"></i>
            <span>Car: {{ r.carType || "N/A" }}</span>
          </div>
        </div>

        <div class="col-md-5 text-md-end">
          <p class="mb-1 fw-bold text-gray-900">
            <strong class="me-1">Fare:</strong>
            <span class="text-success fare-display">₹{{ r.fare | number : "1.2-2" }}</span>
          </p>

          <div class="mt-2 mb-2">
            <ng-container
              *ngIf="
                !!r.rating?.rating && r.rating.rating > 0;
                else reviewButton
              "
            >
              <span class="badge bg-primary text-white me-1 mb-1"
                ><i class="bi bi-star-fill me-1"></i> Reviewed</span
              >
              <div class="star-rating-display">
                <ng-container
                  *ngFor="let star of [].constructor(r.rating.rating)"
                >
                  <i class="bi bi-star-fill text-warning"></i>
                </ng-container>
                <ng-container
                  *ngFor="let empty of [].constructor(5 - r.rating.rating)"
                >
                  <i class="bi bi-star text-muted"></i>
                </ng-container>
              </div>
            </ng-container>
          </div>

          <p class="text-xs text-muted mt-2">
            Ride ID: {{ r.rideId.substring(0, 8) + "..." }}
            <span
              matTooltip="{{ r.rideId }}"
              matTooltipPosition="above"
              class="bi bi-info-circle-fill"
            ></span>
          </p>
        </div>
      </div>

      <div
        class="d-flex justify-content-end ride-card-footer border-top border-gray-100"
      >
        <button
          class="btn btn-outline-primary btn-sm me-2"
          matTooltip="Download Receipt"
          matTooltipPosition="left"
          (click)="downloadReceipt(r.rideId)"
        >
          <i class="bi bi-file-earmark-arrow-down-fill me-1"></i> Download Receipt
        </button>

        <ng-template #reviewButton>
          <button
            class="btn btn-success btn-sm"
            (click)="openRatingSubmission(r)"
            *ngIf="r.status === rideStatus.Completed && (!r.rating || !r.rating.rating || r.rating.rating <= 0)"
            matTooltip="Leave a Review"
            matTooltipPosition="right"
          >
            <i class="bi bi-pencil-square me-1"></i> Leave Review
          </button>
        </ng-template>
      </div>
    </div>

    <nav aria-label="Page navigation" *ngIf="totalPages > 1">
      <ul class="pagination justify-content-center mt-6">
        <li class="page-item" [class.disabled]="currentPage === 1">
          <button class="page-link" (click)="goToPage(currentPage - 1)">
            <i class="bi bi-arrow-left"></i> Previous
          </button>
        </li>
        <li
          class="page-item"
          *ngFor="let page of [].constructor(totalPages); let i = index"
          [class.active]="currentPage === i + 1"
        >
          <button class="page-link" (click)="goToPage(i + 1)">
            {{ i + 1 }}
          </button>
        </li>
        <li class="page-item" [class.disabled]="currentPage === totalPages">
          <button class="page-link" (click)="goToPage(currentPage + 1)">
            Next <i class="bi bi-arrow-right"></i>
          </button>
        </li>
      </ul>
    </nav>
  </div>
</div>
