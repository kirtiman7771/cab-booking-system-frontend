<footer class="footer-section">
    <div class="container py-5">
        <div class="row">
            <!-- Logo and Description -->
            <div class="col-lg-4 mb-4 mb-md-0">
                <div class="logo-area">
                    <span class="logo-text">Vector</span>
                    <p class="tagline mt-2">
                        Your journey, reimagined.
                    </p>
                </div>
                <div class="social-links mt-4">
                    <a href="#" class="social-icon"><i class="bi bi-facebook"></i></a>
                    <a href="#" class="social-icon"><i class="bi bi-twitter"></i></a>
                    <a href="#" class="social-icon"><i class="bi bi-linkedin"></i></a>
                    <a href="#" class="social-icon"><i class="bi bi-instagram"></i></a>
                </div>
            </div>

            <!-- Footer Links -->
            <div class="col-lg-8">
                <div class="row">
                    <div class="col-6 col-md-3 mb-4 mb-md-0">
                        <h6>Company</h6>
                        <ul class="footer-links">
                            <li *ngFor="let link of footerLinks.company">
                                <a href="#">{{link}}</a>
                            </li>
                        </ul>
                    </div>
                    <div class="col-6 col-md-3 mb-4 mb-md-0">
                        <h6>Products</h6>
                        <ul class="footer-links">
                            <li *ngFor="let link of footerLinks.products">
                                <a href="#">{{link}}</a>
                            </li>
                        </ul>
                    </div>
                    <div class="col-6 col-md-3 mb-4 mb-md-0">
                        <h6>Global citizenship</h6>
                        <ul class="footer-links">
                            <li *ngFor="let link of footerLinks.citizenship">
                                <a href="#">{{link}}</a>
                            </li>
                        </ul>
                    </div>
                    <div class="col-6 col-md-3 mb-4 mb-md-0">
                        <h6>Policies</h6>
                        <ul class="footer-links">
                            <li *ngFor="let link of footerLinks.Policies">
                                <a href="#">{{link}}</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer-bottom mt-5 pt-4 d-flex justify-content-between align-items-center flex-wrap">
            <div class="footer-info d-flex align-items-center flex-wrap">
                <a href="#" class="me-3 fw-bold">Made With <i class="bi bi-calendar-heart text-red"></i> By Team Vector</a>
                <!-- <a href="#" class="me-3">Accessibility</a>
                <a href="#" class="me-3">Terms</a> -->
            </div>
            <span>&copy; {{ currentYear }} Vector Inc.</span>
        </div>
    </div>
</footer>

<!-- External stylesheet for Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
