
<section class="hero">
    <div class="hero-text">
        <h1>Go anywhere with<br><span>Vector</span></h1>
        <p>Request a ride, hop in, and go.</p>

        <form class="booking-form">
            <input type="text" placeholder="Enter pickup location" required>
            <input style="border-left-color: #fb2803;" type="text" placeholder="Enter drop location" required>
            <div class="actions">
                <button type="submit" class="btn-primary" (click)="openUserLogin()">Request Now</button>
            </div>
        </form>
    </div>

    <div class="hero-image">
        <img src="/hero-right.png" alt="Hero Image">
    </div>
</section>
